  /api/v1/bulk_sends/csv_template/:
    get:
      description: "Fetches a CSV template that corresponds to the provided document\
        \ template IDs. CSV templates are blank CSV files that have columns containing\
        \ required and optional data that can be sent when creating a bulk send. Fields\
        \ can be referenced by the field label. Example: [placeholder name]_[field\
        \ label] could be something like customer_address or signer_company_name (if\
        \ 'Customer' and 'Signer' were placeholder names for templates set up in SignWell)."
      operationId: getBulkSendCsvTemplate
      parameters:
      - explode: true
        in: query
        name: "template_ids[]"
        required: true
        schema:
          $ref: "#/components/schemas/BulkSendTemplateIds"
        style: form
      - explode: true
        in: query
        name: base64
        required: false
        schema:
          $ref: "#/components/schemas/Base64Flag"
        style: form
      responses:
        "200":
          content:
            application/octet-stream:
              example: |
                document_sender_email,document_sender_name
                fart_138@becker.test,Fart
              schema:
                format: binary
                type: string
            application/json:
              example:
                data: ZG9jdW1lbnRfc2VuZGVyX2VtYWlsLGRvY3VtZW50X3NlbmRlcl9uYW1lCnRlcnJ5X3NjYXJ5XzE0MkBuaWNvbGFzLnRlc3QsU2NhcnkgVGVycnkK
              schema:
                $ref: "#/components/schemas/BulkSendCsvTemplateResponse"
          description: successful
        "401":
          content:
            application/json:
              example:
                message: Missing or invalid authorization key
                meta:
                  error: api_key_unauthorized_error
                  message: Not valid authorization token
                  messages:
                  - Not valid authorization token
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: unauthorized
        "404":
          content:
            application/json:
              example:
                message: Not found
                meta:
                  error: record_not_found
                  message: Couldn't find the template requested
                  messages:
                  - Couldn't find the template requested
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: not found
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitErrorResponse"
          description: rate limit exceeded
      security:
      - api_key: []
      summary: Get Bulk Send CSV Template
      tags:
      - Bulk Send
      x-signwell-csharp-response-modes:
      - stream
      - base64
  /api/v1/bulk_sends/validate_csv/:
    post:
      description: "Validates a Bulk Send CSV file before creating the Bulk Send.\
        \ It will check the structure of the CSV and the data it contains, and return\
        \ any errors found."
      operationId: validateBulkSendCsv
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkSendCsvRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                bulk_send_csv: 
                template_ids:
                - a80001a0-2936-44ae-b0a2-4eb4e70ef3ef
                skip_row_errors: false
                api_application_id: null
                name: arena_linger/in.css
                subject: Please complete arena_linger/in.css
                message: "<p>Hey there,</p><p>&nbsp;</p><p>Please review and complete\
                  \ this document. You can click on the document below to get started.</p>"
                apply_signing_order: false
              schema:
                $ref: "#/components/schemas/BulkSendValidateCsvResponse"
          description: successful
        "422":
          content:
            application/json:
              example:
                errors:
                  bulk_send_csv:
                  - row: 2
                    data:
                      document_sender_email: not an email
                      document_sender_name: email@signwell.com
                      document_sender_label: Label
                      recipient_email: recipient@signwell.com
                      recipient_name: Recipient
                      recipient_label: Recipient
                    errors:
                    - "The following columns have an email address invalid: document_sender_email."
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: unprocessable entity
        "401":
          content:
            application/json:
              example:
                message: Missing or invalid authorization key
                meta:
                  error: api_key_unauthorized_error
                  message: Not valid authorization token
                  messages:
                  - Not valid authorization token
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: unauthorized
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitErrorResponse"
          description: rate limit exceeded
      security:
      - api_key: []
      summary: Validate Bulk Send CSV
      tags:
      - Bulk Send
components:
  schemas:
    FieldType:
      description: Type of signing field
      enum:
      - initials
      - signature
      - checkbox
      - date
      - select
      - text
      - dropdown
      - autofill_company
      - autofill_email
      - autofill_first_name
      - autofill_last_name
      - autofill_name
      - autofill_phone
      - autofill_title
      - autofill_date_signed
      type: string
    TextValidation:
      description: Validation rule for text fields
      enum:
      - no_text_validation
      - numbers
      - letters
      - email_address
      - us_phone_number
      - us_zip_code
      - us_ssn
      - us_age
      - alphanumeric
      - us_bank_routing_number
      - us_bank_account_number
      type: string
    DateFormat:
      description: "Date format for date fields. Valid values: MM/DD/YYYY, DD/MM/YYYY,\
        \ YYYY/MM/DD, Month DD, YYYY, MM/DD/YYYY hh:mm:ss a. Default: MM/DD/YYYY"
      enum:
      - MM/DD/YYYY
      - DD/MM/YYYY
      - YYYY/MM/DD
      - "Month DD, YYYY"
      - MM/DD/YYYY hh:mm:ss a
      type: string
    CheckboxValidation:
      description: Validation rule for checkbox groups
      enum:
      - minimum
      - maximum
      - range
      - exact
      type: string
    FileInfo:
      description: File information
      example:
        name: name
        pages_number: 5
      properties:
        name:
          description: File name
          nullable: true
          type: string
        pages_number:
          description: Number of pages in the file
          type: integer
      required:
      - pages_number
      type: object
    LabelInfo:
      description: Label information
      example:
        name: name
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        id:
          description: Label ID
          format: uuid
          type: string
        name:
          description: Label name
          type: string
      type: object
    CopiedContactInfo:
      description: Copied contact information
      example:
        name: name
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        email: email
      properties:
        id:
          description: Contact ID
          format: uuid
          type: string
        name:
          description: Contact name
          type: string
        email:
          description: Contact email
          format: email
          type: string
      required:
      - email
      type: object
    CheckboxGroupInfo:
      description: Checkbox group configuration
      example:
        min_value: 9
        checkbox_ids:
        - checkbox_ids
        - checkbox_ids
        exact_value: 2
        group_name: group_name
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        validation: minimum
        required: true
        recipient_id: recipient_id
        max_value: 3
      properties:
        id:
          description: Checkbox group ID
          format: uuid
          type: string
        group_name:
          description: Name of the checkbox group
          nullable: true
          type: string
        recipient_id:
          description: Recipient ID associated with the group
          nullable: true
          type: string
        checkbox_ids:
          description: IDs of checkboxes in this group
          items:
            type: string
          type: array
        validation:
          $ref: "#/components/schemas/CheckboxValidation"
        required:
          description: Whether at least one checkbox must be checked
          type: boolean
        min_value:
          description: Minimum number of checkboxes to check
          type: integer
        max_value:
          description: Maximum number of checkboxes to check
          type: integer
        exact_value:
          description: Exact number of checkboxes that must be checked
          type: integer
      required:
      - checkbox_ids
      - id
      - required
      type: object
    AttachmentRequestInfo:
      description: Attachment request information
      example:
        name: name
        url: http://example.com/aeiou
        required: true
      properties:
        name:
          description: Name of the attachment request
          type: string
        url:
          description: URL of the uploaded attachment (when available)
          format: url
          type: string
        required:
          description: Whether the attachment is required
          type: boolean
      required:
      - name
      - required
      type: object
    AdditionalFields:
      description: Fields to be added to any appended files (not existing files).
        Document fields placed on a document for collecting data or signatures from
        recipients. Field data should be sent as a 2-dimensional JSON array. One array
        of fields is needed for each file in the files array. An array of fields can
        be empty if you have a file that does not contain any fields.
      items:
        description: Array of Fields you're adding to each file.
        items:
          $ref: "#/components/schemas/AdditionalFields_inner_inner"
        type: array
      type: array
    AdditionalFiles:
      items:
        $ref: "#/components/schemas/AdditionalFiles_inner"
      type: array
    ApiApplicationId:
      description: Unique identifier for API Application settings to use. API Applications
        are optional and mainly used when isolating OAuth apps or for more control
        over embedded API settings
      format: uuid
      type: string
    TemplateAttachmentRequests:
      description: Attachments that a recipient must upload to complete the signing
        process. Attachment requests are shown after all document fields have been
        completed.
      items:
