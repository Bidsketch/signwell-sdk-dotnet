name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Resolve version
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet restore SignWell.Sdk.sln --locked-mode
      - run: dotnet format SignWell.Sdk.sln --verify-no-changes --no-restore
      - run: dotnet build SignWell.Sdk.sln -c Release --no-restore -p:Version="$PACKAGE_VERSION"
      - run: dotnet test SignWell.Sdk.sln -c Release --no-build -p:Version="$PACKAGE_VERSION"
      - run: dotnet pack src/SignWell.Sdk/SignWell.Sdk.csproj -c Release --no-build -p:Version="$PACKAGE_VERSION" -o artifacts
      - uses: anchore/sbom-action@v0
        with:
          path: artifacts
          output-file: artifacts/SignWell.Sdk.spdx.json
      - uses: actions/attest@v4
        with:
          subject-path: artifacts/SignWell.Sdk.*.nupkg
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/SignWell.Sdk.${PACKAGE_VERSION}.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--generate-notes)
          if [[ "$PACKAGE_VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" artifacts/* "${args[@]}"
