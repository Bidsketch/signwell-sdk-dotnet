name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SignWell.Sdk.sln --locked-mode
      - run: dotnet format SignWell.Sdk.sln --verify-no-changes --no-restore
      - run: dotnet build SignWell.Sdk.sln -c Release --no-restore
      - run: dotnet test SignWell.Sdk.sln -c Release --no-build
      - run: dotnet pack src/SignWell.Sdk/SignWell.Sdk.csproj -c Release --no-build -o artifacts
      - run: dotnet list src/SignWell.Sdk/SignWell.Sdk.csproj package --vulnerable --include-transitive
      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*

  compatibility:
    strategy:
      matrix:
        include:
          - os: windows-latest
            framework: net48
          - os: ubuntu-latest
            framework: net8.0
          - os: ubuntu-latest
            framework: net10.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Pack SDK
        shell: bash
        run: dotnet pack src/SignWell.Sdk/SignWell.Sdk.csproj -c Release -o artifacts
      - name: Consume packed SDK
        if: runner.os != 'Windows'
        shell: bash
        env:
          FRAMEWORK: ${{ matrix.framework }}
        run: |
          dotnet restore samples/SignWell.Sdk.Smoke/SignWell.Sdk.Smoke.csproj --source "$PWD/artifacts" --source https://api.nuget.org/v3/index.json
          dotnet build samples/SignWell.Sdk.Smoke/SignWell.Sdk.Smoke.csproj -c Release --no-restore -p:TargetFramework="$FRAMEWORK"
      - name: Consume packed SDK on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FRAMEWORK: ${{ matrix.framework }}
        run: |
          dotnet nuget add source "$env:GITHUB_WORKSPACE/artifacts" --name signwell-local
          dotnet restore samples/SignWell.Sdk.Smoke/SignWell.Sdk.Smoke.csproj
          dotnet build samples/SignWell.Sdk.Smoke/SignWell.Sdk.Smoke.csproj -c Release --no-restore -p:TargetFramework="$env:FRAMEWORK"
